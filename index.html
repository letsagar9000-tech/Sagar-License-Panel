<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagar License Panel - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:20px;font-family:Arial,sans-serif;color:#fff;
  background:radial-gradient(circle at top,#10264d,#050914 65%);
}
.login-box{
  width:100%;max-width:390px;padding:30px 24px;
  background:#091326;border:1px solid #1768ff;border-radius:18px;
  box-shadow:0 0 30px #1265ff25;
}
.logo{text-align:center;font-size:38px;margin-bottom:12px}
h1{text-align:center;font-size:25px;color:#49a5ff;margin-bottom:8px}
.subtitle{text-align:center;font-size:13px;color:#a9bddb;margin-bottom:25px}
label{display:block;font-size:13px;color:#d8e6ff;margin:15px 0 8px}
input,select{
  width:100%;padding:13px;background:#071126;color:white;
  border:1px solid #29446c;border-radius:8px;font-size:15px;
}
button{
  width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;
  background:linear-gradient(90deg,#1265ff,#00aaff);
  color:white;font-weight:bold;font-size:15px;cursor:pointer;
}
#message{font-size:13px;line-height:1.5;text-align:center;margin-top:16px;color:#ffb7b7}
.footer{text-align:center;color:#7185a7;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<main class="login-box">
  <div class="logo">🔐</div>
  <h1>SAGAR LICENSE</h1>
  <p class="subtitle">Secure License Management Panel</p>

  <form id="loginForm">
    <label for="role">Account Type</label>
    <select id="role" required>
      <option value="seller">Seller Login</option>
      <option value="admin">Admin Login</option>
    </select>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter username"
           autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password"
           autocomplete="current-password" required>

    <button type="submit">LOGIN SECURELY</button>
    <p id="message" role="status"></p>
  </form>

  <div class="footer">© 2026 Sagar License Panel</div>
</main>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  document.getElementById("message").textContent =
    "Backend authentication is not connected yet.";
});
</script>
</body>
</html>
